# Compila la app Android de Campo KML cada vez que se suben cambios
# y publica el APK en la sección "Releases" del repositorio.
name: App Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Preparar proyecto Android
        working-directory: android-build
        run: |
          npm install --no-audit --no-fund
          node prepare.js www
          npx cap add android
          node prepare.js android
          npx cap sync android

      - name: Firma estable (para poder actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp android-build/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android-build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android-build/android/app/build/outputs/apk/debug/app-debug.apk CampoKML.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk CampoKML.apk \
            --title "Campo KML para Android (versión 1.0.${{ github.run_number }})" \
            --notes "Compilada automáticamente el $(date -u +'%d/%m/%Y %H:%M') UTC. Descarga CampoKML.apk desde el móvil para instalarla o actualizarla." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: CampoKML-apk
          path: CampoKML.apk
